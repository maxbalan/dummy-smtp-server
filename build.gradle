plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
}

group = 'com.github.maxbalan'
version = file('VERSION').text.trim()

description = 'In-memory SMTP capture service for development and automated testing'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.2.0')
    implementation platform('org.springframework.ai:spring-ai-bom:2.1.0')
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.2.0')
    testImplementation platform('org.springframework.ai:spring-ai-bom:2.1.0')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.1'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'com.github.davidmoten:subethasmtp:7.2.2'
    implementation 'org.eclipse.angus:angus-mail'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processResources') {
    from('resources/oas/openapi.yaml') {
        into 'static/openapi'
    }
}
